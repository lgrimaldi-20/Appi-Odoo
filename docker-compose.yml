# Orquestacion del middleware API-Odoo con cola de tareas (Fase 5).
#
#   web    -> API FastAPI (uvicorn) en el puerto 8000
#   worker -> worker Celery que procesa las tareas en background
#   redis  -> broker y backend de resultados de Celery
#
# Uso:
#   docker compose up --build
#
# Las credenciales de Odoo y la API_KEY se toman de .env (env_file).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Las tres bases SQLite se montan desde el host en /app/datos.
  #
  # Sin esto cada contenedor llevaria su PROPIA copia dentro de su sistema de
  # ficheros: el panel mostraria una base, el worker escribiria en otra y la
  # idempotencia -que se apoya en sync_map- dejaria de proteger, porque cada
  # servicio veria un historial distinto. Ademas todo se perderia al parar.
  #
  # En produccion esto va a PostgreSQL (una sola base, varios clientes); el
  # volumen es lo que hace utilizable SQLite mientras tanto.
  web:
    build: .
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/datos/control_turycopi.db
      SOURCE_DATABASE_URL: sqlite:////app/datos/cola_turycopi.db
    volumes:
      - ./control_turycopi.db:/app/datos/control_turycopi.db
      - ./cola_turycopi.db:/app/datos/cola_turycopi.db
    ports:
      - "8000:8000"
    depends_on:
      - redis
    command: uvicorn api:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/datos/control_turycopi.db
      SOURCE_DATABASE_URL: sqlite:////app/datos/cola_turycopi.db
    volumes:
      - ./control_turycopi.db:/app/datos/control_turycopi.db
      - ./cola_turycopi.db:/app/datos/cola_turycopi.db
    depends_on:
      - redis
    command: celery -A core.celery_app.celery_app worker --loglevel=info

  # Beat es el RELOJ: sin este servicio el worker existe pero nadie le encarga
  # nada de forma periodica, y el flujo automatico (maestros -> ingesta ->
  # poller) no arranca solo. Va en un contenedor aparte del worker porque debe
  # haber UNA sola instancia: dos relojes encolarian cada tarea por duplicado.
  beat:
    build: .
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DATABASE_URL: sqlite:////app/datos/control_turycopi.db
      SOURCE_DATABASE_URL: sqlite:////app/datos/cola_turycopi.db
    volumes:
      - ./control_turycopi.db:/app/datos/control_turycopi.db
      - ./cola_turycopi.db:/app/datos/cola_turycopi.db
    depends_on:
      - redis
    command: celery -A core.celery_app.celery_app beat --loglevel=info
