# -----------------------------------------------------------------------------
# Configuracion declarativa de MAPEO (Data Mapper - Fase 2)
#
# Traduce los registros de la base de datos de ORIGEN al esquema de Odoo.
# Editable sin tocar codigo Python.
#
# Estructura por entidad:
#   <entidad>:
#     model: <modelo Odoo destino>            # p.ej. account.move
#     id_origen: <campo del registro origen que identifica el registro>
#     defaults: {campo_odoo: valor}           # valores fijos (p.ej. move_type)
#     campos:   {campo_origen: campo_odoo}    # renombrado directo 1:1
#     resolver:                               # claves foraneas: busca el id en Odoo
#       <campo_odoo>:
#         desde: <campo_origen>               # valor a buscar (tomado del registro)
#         model: <modelo Odoo donde buscar>   # p.ej. res.partner
#         buscar_por: <campo Odoo>            # campo por el que se filtra (p.ej. vat)
#         obligatorio: true|false             # si true y no se encuentra -> error
# -----------------------------------------------------------------------------

factura:
  model: account.move
  id_origen: factura_id
  # Si se define, tras postear se valida que amount_total en Odoo coincida
  # al centimo con este campo del registro de origen (control de impuestos).
  validar_total: total
  defaults:
    move_type: out_invoice          # factura de cliente
  campos:
    fecha: invoice_date
    referencia: ref
    # Lineas de factura: el origen las envia ya en formato de comando Odoo
    # (p.ej. [(0, 0, {"product_id": X, "quantity": N, "price_unit": P})]).
    lineas: invoice_line_ids
  resolver:
    partner_id:
      desde: cliente_nif
      model: res.partner
      buscar_por: vat
      obligatorio: true
    # Moneda del documento (dualidad Bs/USD). Se busca por el nombre ISO de la
    # moneda (p.ej. "VES" para bolivares, "USD" para dolares). Opcional: si no
    # se indica moneda_iso, Odoo emite en la moneda de la compania. Odoo calcula
    # el equivalente en la moneda de la compania con la tasa de cambio vigente.
    currency_id:
      desde: moneda_iso
      model: res.currency
      buscar_por: name
      obligatorio: false

# -----------------------------------------------------------------------------
# Los cuatro tipos de documento de account.move se declaran como entidades
# SEPARADAS, no como un campo "tipo" dentro del registro.
#
# El motivo es de seguridad contable: move_type decide el SIGNO del apunte. Si
# el tipo viajara como un dato mas y llegara vacio o mal escrito, se aplicaria
# el defecto (out_invoice) y una devolucion se registraria como una venta: el
# cliente quedaria DEBIENDO el importe en vez de que se le abone, sin ningun
# error visible. Como entidad, un nombre equivocado se rechaza con
# "sin mapeo definido" en vez de contabilizar lo contrario de lo pedido.
#
#   factura            -> out_invoice  factura de cliente        (venta)
#   nota_credito       -> out_refund   devolucion a cliente      (abono)
#   factura_proveedor  -> in_invoice   factura de proveedor      (compra)
#   nota_debito        -> in_refund    devolucion a proveedor
#
# "factura" se mantiene como venta para no romper las integraciones que ya
# existen: quien no declare tipo sigue emitiendo facturas de cliente.
# -----------------------------------------------------------------------------

nota_credito:
  model: account.move
  id_origen: factura_id
  validar_total: total
  defaults:
    move_type: out_refund           # nota de credito (devolucion de venta)
  campos:
    fecha: invoice_date
    referencia: ref
    # Lineas: el origen las envia ya en formato de comando Odoo
    # (p.ej. [(0, 0, {"product_id": X, "quantity": N, "price_unit": P})]).
    lineas: invoice_line_ids
  resolver:
    partner_id:
      desde: cliente_nif
      model: res.partner
      buscar_por: vat
      obligatorio: true
    currency_id:
      desde: moneda_iso
      model: res.currency
      buscar_por: name
      obligatorio: false

factura_proveedor:
  model: account.move
  id_origen: factura_id
  validar_total: total
  defaults:
    move_type: in_invoice           # factura de proveedor (compra)
  campos:
    fecha: invoice_date
    referencia: ref
    # Lineas: el origen las envia ya en formato de comando Odoo
    # (p.ej. [(0, 0, {"product_id": X, "quantity": N, "price_unit": P})]).
    lineas: invoice_line_ids
  resolver:
    partner_id:
      desde: proveedor_nif
      model: res.partner
      buscar_por: vat
      obligatorio: true
    currency_id:
      desde: moneda_iso
      model: res.currency
      buscar_por: name
      obligatorio: false

nota_debito:
  model: account.move
  id_origen: factura_id
  validar_total: total
  defaults:
    move_type: in_refund            # devolucion a proveedor
  campos:
    fecha: invoice_date
    referencia: ref
    # Lineas: el origen las envia ya en formato de comando Odoo
    # (p.ej. [(0, 0, {"product_id": X, "quantity": N, "price_unit": P})]).
    lineas: invoice_line_ids
  resolver:
    partner_id:
      desde: proveedor_nif
      model: res.partner
      buscar_por: vat
      obligatorio: true
    currency_id:
      desde: moneda_iso
      model: res.currency
      buscar_por: name
      obligatorio: false

pago:
  model: account.payment
  id_origen: pago_id
  defaults:
    payment_type: inbound           # ingreso (cobro de cliente)
    # Odoo 19 exige partner_type explicito para resolver la cuenta contrapartida
    # (customer -> cuenta por cobrar). Antes se infería en algunos flujos.
    partner_type: customer
  campos:
    monto: amount
    fecha: date
  resolver:
    partner_id:
      desde: cliente_nif
      model: res.partner
      buscar_por: vat
      obligatorio: true
    journal_id:
      desde: diario_codigo
      model: account.journal
      buscar_por: code
      obligatorio: true
    # Moneda del pago (dualidad Bs/USD). Debe coincidir con la moneda de la
    # factura para conciliar sin descuadres por tipo de cambio. Opcional.
    currency_id:
      desde: moneda_iso
      model: res.currency
      buscar_por: name
      obligatorio: false
