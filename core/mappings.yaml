# -----------------------------------------------------------------------------
# Configuracion declarativa de MAPEO (Data Mapper - Fase 2)
#
# Traduce los registros de la base de datos de ORIGEN al esquema de Odoo.
# Editable sin tocar codigo Python.
#
# Estructura por entidad:
#   <entidad>:
#     model: <modelo Odoo destino>            # p.ej. account.move
#     id_origen: <campo del registro origen que identifica el registro>
#     defaults: {campo_odoo: valor}           # valores fijos (p.ej. move_type)
#     campos:   {campo_origen: campo_odoo}    # renombrado directo 1:1
#     resolver:                               # claves foraneas: busca el id en Odoo
#       <campo_odoo>:
#         desde: <campo_origen>               # valor a buscar (tomado del registro)
#         model: <modelo Odoo donde buscar>   # p.ej. res.partner
#         buscar_por: <campo Odoo>            # campo por el que se filtra (p.ej. vat)
#         obligatorio: true|false             # si true y no se encuentra -> error
# -----------------------------------------------------------------------------

factura:
  model: account.move
  id_origen: factura_id
  # Si se define, tras postear se valida que amount_total en Odoo coincida
  # al centimo con este campo del registro de origen (control de impuestos).
  validar_total: total
  defaults:
    move_type: out_invoice          # factura de cliente
  campos:
    fecha: invoice_date
    referencia: ref
    # Lineas de factura: el origen las envia ya en formato de comando Odoo
    # (p.ej. [(0, 0, {"product_id": X, "quantity": N, "price_unit": P})]).
    lineas: invoice_line_ids
  resolver:
    partner_id:
      desde: cliente_nif
      model: res.partner
      buscar_por: vat
      obligatorio: true
    # Moneda del documento (dualidad Bs/USD). Se busca por el nombre ISO
    # (p.ej. "VES" para bolivares, "USD" para dolares). Opcional: sin
    # moneda_iso, Odoo emite en la moneda de la compania. Odoo calcula el
    # equivalente en la moneda de la compania con la tasa vigente.
    currency_id:
      desde: moneda_iso
      model: res.currency
      buscar_por: name
      obligatorio: false

pago:
  model: account.payment
  id_origen: pago_id
  defaults:
    payment_type: inbound           # ingreso (cobro de cliente)
    # Obligatorio en Odoo 17: de el depende contra que cuenta se asienta la
    # contrapartida (por cobrar si es customer, por pagar si es supplier). Sin
    # enviarlo, create() falla con "Missing required account on accountable
    # line", porque el valor por defecto del modelo no cuadra con un cobro.
    partner_type: customer
  campos:
    monto: amount
    fecha: date
  resolver:
    partner_id:
      desde: cliente_nif
      model: res.partner
      buscar_por: vat
      obligatorio: true
    # Moneda del documento (dualidad Bs/USD). Se busca por el nombre ISO
    # (p.ej. "VES" para bolivares, "USD" para dolares). Opcional: sin
    # moneda_iso, Odoo emite en la moneda de la compania. Odoo calcula el
    # equivalente en la moneda de la compania con la tasa vigente.
    currency_id:
      desde: moneda_iso
      model: res.currency
      buscar_por: name
      obligatorio: false
    journal_id:
      desde: diario_codigo
      model: account.journal
      buscar_por: code
      obligatorio: true
